            this.presenceTimer = window.setInterval(() => this.publishPresence(), 2000);
          } catch (error) {
            this.status("Signal " + cleanError(error), true, true);
          }

          this.startMotionLoop();
          this.heartbeatTimer = window.setInterval(() => this.broadcastHeartbeat(), 1000);
          positionZone(this.video, this.zoneEl, this.zone);
        }

        async openCamera(deviceId = "") {
          const video = {
            frameRate: { ideal: 60, max: 60 },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          };
          if (deviceId) video.deviceId = { exact: deviceId };
          else video.facingMode = { ideal: "environment" };

          const newStream = await navigator.mediaDevices.getUserMedia({ audio: false, video });
          const newTrack = newStream.getVideoTracks()[0];
          if (!newTrack) throw new Error("No video track");

          const oldStream = this.stream;
          this.stream = newStream;
          this.videoTrack = newTrack;
          this.video.classList.add("fading");
          this.video.srcObject = newStream;
          await this.video.play().catch(() => {});
          requestAnimationFrame(() => this.video.classList.remove("fading"));

          await this.refreshDevices();
          const settings = newTrack.getSettings ? newTrack.getSettings() : {};
          this.deviceIndex = this.devices.findIndex((device) => device.deviceId === settings.deviceId);
          this.updateTorchSupport();

          for (const peer of this.sessionPeers.values()) {
            const sender = peer.pc.getSenders().find((item) => item.track && item.track.kind === "video");
            if (sender) await sender.replaceTrack(newTrack).catch(() => {});
            this.sendState(peer);
          }

          if (oldStream) {
            for (const track of oldStream.getTracks()) track.stop();
          }
          this.broadcastState();
          positionZone(this.video, this.zoneEl, this.zone);
          this.applyPresentation();
        }

        async refreshDevices() {
          try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            this.devices = devices.filter((device) => device.kind === "videoinput");
          } catch {
            this.devices = [];
          }
        }

        updateTorchSupport() {
          const caps = this.videoTrack?.getCapabilities ? this.videoTrack.getCapabilities() : {};
          this.torchSupported = !!caps.torch;
          if (!this.torchSupported) this.torchOn = false;
          this.torchBtn.disabled = !this.torchSupported;
          this.torchBtn.textContent = this.torchOn ? "Flash On" : "Flash";
        }

        async switchCamera() {
          await this.refreshDevices();
          if (!this.devices.length) {
            this.status("No lenses", true);
            return;
          }
          const currentSettings = this.videoTrack?.getSettings ? this.videoTrack.getSettings() : {};
          const currentIndex = this.devices.findIndex((device) => device.deviceId === currentSettings.deviceId);
          const nextIndex = ((currentIndex >= 0 ? currentIndex : this.deviceIndex) + 1) % this.devices.length;
          const nextDevice = this.devices[nextIndex];
          this.deviceIndex = nextIndex;
          this.torchOn = false;
          try {
            await this.openCamera(nextDevice.deviceId);
            this.status("Lens switched");
          } catch (error) {
            this.status("Lens " + cleanError(error), true);
          }
        }

        async setTorch(value) {
          if (!this.videoTrack || !this.torchSupported) {
            this.status("Flash unsupported", true);
            return;
          }
          const wanted = !!value;
          try {
            await this.videoTrack.applyConstraints({ advanced: [{ torch: wanted }] });
            this.torchOn = wanted;
            this.updateTorchSupport();
            this.broadcastState();
          } catch (error) {
            this.torchOn = false;
            this.updateTorchSupport();
            this.status("Flash " + cleanError(error), true);
          }
        }

        publishPresence() {
          this.bus?.publish(this.code, {
            type: "presence",
            from: this.selfId,
            code: this.code,
            deviceName: this.deviceName,
            state: this.getCameraState()
          }).catch(() => {});
        }

        setMotionEnabled(value) {
          this.motionEnabled = !!value;
          if (!this.motionEnabled && this.motionActive) {
            this.motionActive = false;
            this.zoneEl.classList.remove("motion");
            for (const peer of this.sessionPeers.values()) {
              sendData(peer.dc, { type: "motion", active: false, score: 0, zone: this.zone });
            }
          }
          this.detectBtn.textContent = this.motionEnabled ? "Detection On" : "Detection Off";
          this.saveSenderSettings();
          this.broadcastState();
          this.status(this.motionEnabled ? "Detection enabled" : "Detection disabled");
        }

        toggleZoneShape() {
          this.zone = {
            ...normalizeZone(this.zone, getDisplayedVideoRect(this.video)),
            shape: this.zone.shape === "ellipse" ? "rect" : "ellipse"
          };
          this.shapeBtn.textContent = this.zone.shape === "ellipse" ? "Oval Zone" : "Rect Zone";
          positionZone(this.video, this.zoneEl, this.zone);
          this.saveSenderSettings();
          this.broadcastZone();
          this.broadcastState();
        }

        applyPresentation() {
          applyVideoPresentation(this.video, this.rotation, this.night);
          if (this.nightBadge) {
            const level = Math.round((this.night?.level || 0) * 100);
            this.nightBadge.textContent = level > 8 ? `Night ${level}%` : "Night auto";
          }
        }

        onSignal(topic, message) {
          if (this.closed || codeFromTopic(topic) !== this.code || message.from === this.selfId) return;
          if (message.type === "offer" && message.sdp) {
            this.answerOffer(message).catch((error) => this.status("Offer " + cleanError(error), true));
            return;
          }
          if (message.type === "candidate" && message.candidate && message.session) {
            const peer = this.sessionPeers.get(message.session);
            if (peer) this.addIce(peer, message.candidate);
            else {
              const pending = this.pendingCandidates.get(message.session) || [];
              pending.push(message.candidate);
              this.pendingCandidates.set(message.session, pending);
            }
          }
        }

        async answerOffer(message) {
          this.closePeer(message.session);
          const pc = makePeerConnection();
          const peer = {
            pc,
            dc: null,
            session: message.session,
            remoteId: message.from,
            queuedCandidates: [],
            state: "new"
          };
          this.sessionPeers.set(peer.session, peer);
          this.updatePeerBadge();

          pc.onicecandidate = (event) => {
            if (event.candidate) {
              this.bus.publish(this.code, {
                type: "candidate",
                from: this.selfId,
                to: peer.remoteId,
                session: peer.session,
                candidate: event.candidate
              }).catch(() => {});
            }
          };
          pc.onconnectionstatechange = () => {
            peer.state = pc.connectionState;
            this.updatePeerBadge();
            if (pc.connectionState === "failed") this.status("P2P failed. Trying relay.", true, true);
            if (pc.connectionState === "connected") {
              sleep(600).then(async () => {
                const codec = await detectVideoCodec(pc, "out");
                if (codec) this.status("P2P connected " + codec);
              });
            }
          };
          pc.oniceconnectionstatechange = () => {
            if (pc.iceConnectionState === "failed") this.status("ICE failed. Relay required.", true, true);
          };
          pc.ondatachannel = (event) => this.bindDataChannel(peer, event.channel);

          await pc.setRemoteDescription(new RTCSessionDescription(message.sdp));
          const track = this.stream?.getVideoTracks()[0];
          if (!track) throw new Error("No camera track");
          pc.addTrack(track, this.stream);
          preferH264(pc);
          const queued = this.pendingCandidates.get(peer.session) || [];
          this.pendingCandidates.delete(peer.session);
          for (const candidate of queued) await this.addIce(peer, candidate);
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await this.bus.publish(this.code, {
            type: "answer",
            from: this.selfId,
            to: peer.remoteId,
            session: peer.session,
            sdp: pc.localDescription
          });
        }

        bindDataChannel(peer, channel) {
          peer.dc = channel;
          channel.onopen = () => {
            this.sendState(peer);
            this.sendZone(peer);
          };
          channel.onmessage = (event) => this.onCommand(peer, event.data);
          channel.onclose = () => this.updatePeerBadge();
          channel.onerror = () => this.status("Data channel error", true);
        }

        async addIce(peer, candidate) {
          try {
            if (!peer.pc.remoteDescription) {
              peer.queuedCandidates.push(candidate);
              return;
            }
            await peer.pc.addIceCandidate(new RTCIceCandidate(candidate));
          } catch {
            // Stale candidate. Ignore.
          }
        }

        onCommand(peer, raw) {
          let command;
          try {
            command = JSON.parse(raw);
          } catch {
            return;
          }
          if (!command || typeof command.type !== "string") return;
          if (command.type === "switchCamera") this.switchCamera();
          if (command.type === "setTorch") this.setTorch(!!command.value);
          if (command.type === "setSensitivity") {
            this.sensitivity = clamp(Number(command.value) || this.sensitivity, 20, 100);
            this.sensitivityEl.value = String(this.sensitivity);
            this.saveSenderSettings();
            this.broadcastState();
          }
          if (command.type === "setMotionEnabled") this.setMotionEnabled(command.value !== false);
          if (command.type === "setZone" && command.zone) {
            this.zone = normalizeZone(command.zone, getDisplayedVideoRect(this.video));
            this.shapeBtn.textContent = this.zone.shape === "ellipse" ? "Oval Zone" : "Rect Zone";
            positionZone(this.video, this.zoneEl, this.zone);
            this.saveSenderSettings();
            this.broadcastZone();
          }
        }

        getCameraState() {
          const settings = this.videoTrack?.getSettings ? this.videoTrack.getSettings() : {};
          const label = this.devices[this.deviceIndex]?.label || this.videoTrack?.label || "Camera";
          return {
            type: "state",
            deviceName: this.deviceName,
            code: this.code,
            lensLabel: label,
            lensIndex: this.deviceIndex,
            torchOn: this.torchOn,
            torchSupported: this.torchSupported,
            sensitivity: this.sensitivity,
            motionEnabled: this.motionEnabled,
            zone: this.zone,
            rotation: this.rotation,
            night: this.night,
            width: settings.width || 0,
            height: settings.height || 0,
            frameRate: settings.frameRate || 0
          };
        }

        sendState(peer) {
          sendData(peer.dc, this.getCameraState());
        }

        broadcastState() {
          this.updateTorchSupport();
          for (const peer of this.sessionPeers.values()) this.sendState(peer);
        }

        sendZone(peer) {
          sendData(peer.dc, { type: "zone", zone: this.zone });
        }

        broadcastZone() {
          for (const peer of this.sessionPeers.values()) this.sendZone(peer);
        }

        broadcastHeartbeat() {
          for (const peer of this.sessionPeers.values()) {
            sendData(peer.dc, {
              type: "heartbeat",
              state: this.getCameraState(),
              zone: this.zone
            });
          }
        }

        startMotionLoop() {
          const canvas = document.createElement("canvas");
          canvas.width = 72;
          canvas.height = 72;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          const tick = () => {
            if (this.closed) return;
            try {
              this.sampleMotion(ctx, canvas);
            } catch {
              // Bad frame. Try next tick.
            }
            this.motionTimer = window.setTimeout(tick, 120);
          };
          tick();
        }

        sampleMotion(ctx, canvas) {
          if (!ctx || !this.video.videoWidth || !this.video.videoHeight) return;
          const width = this.video.videoWidth;
          const height = this.video.videoHeight;
          const zone = normalizeZone(this.zone, { width, height, min: Math.min(width, height), left: 0, top: 0 });
          this.zone = zone;
          const zoneWidth = clamp(zone.w * width, 8, width);
          const zoneHeight = clamp(zone.h * height, 8, height);
          const sx = clamp(zone.x * width, 0, Math.max(0, width - zoneWidth));
          const sy = clamp(zone.y * height, 0, Math.max(0, height - zoneHeight));
          
          ctx.drawImage(this.video, sx, sy, zoneWidth, zoneHeight, 0, 0, canvas.width, canvas.height);
          const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
          
          const cw = canvas.width;
          const ch = canvas.height;
          const cx = cw / 2;
          const cy = ch / 2;
          const rx = cw / 2;
          const ry = ch / 2;
          const invRx = 1 / Math.max(1, rx);
          const invRy = 1 / Math.max(1, ry);
          const isEllipse = zone.shape === "ellipse";

          const currentFrame = new Float32Array(cw * ch);
          let totalLuma = 0;
          let count = 0;
          let noiseTotal = 0;
          let motionPixels = 0;
          let prevRelLum = 0;
          let noiseCount = 0;

          const avg = this.prevSample != null ? this.prevSample : 120;
          const isSettling = (now() - (this.lastExposureAdjustedAt || 0)) < 2000;
          const sensitivityNorm = (this.sensitivity - 20) / 80;
          const pixelThresholdBase = 38 - sensitivityNorm * 22 + Math.min(18, (this.night?.noise || 0) * 0.25);

          for (let y = 0; y < ch; y++) {
            const ey = (y + 0.5 - cy) * invRy;
            const eySq = ey * ey;
            const rowOffset = y * cw;
            for (let x = 0; x < cw; x++) {
              const pixel = rowOffset + x;
              if (isEllipse) {
                const ex = (x + 0.5 - cx) * invRx;
                if (ex * ex + eySq > 1) continue;
              }
              
              const index = pixel * 4;
              const lum = data[index] * 0.299 + data[index + 1] * 0.587 + data[index + 2] * 0.114;
              totalLuma += lum;
              count++;

              const relLum = lum - avg;
              currentFrame[pixel] = relLum;

              if (noiseCount) noiseTotal += Math.abs(relLum - prevRelLum);

              if (this.prevFrame && !isSettling) {
                if (Math.abs(relLum - this.prevFrame[pixel]) > pixelThresholdBase) {
                  motionPixels++;
                }
              }
              prevRelLum = relLum;
              noiseCount++;
            }
          }

          const avgCurrent = count ? totalLuma / count : 120;
          const noise = noiseCount > 1 ? noiseTotal / (noiseCount - 1) : 0;
          
          this.updateNightVision(avgCurrent, noise);

          if (this.prevSample == null || !this.prevFrame) {
            this.prevSample = avgCurrent;
            this.prevFrame = currentFrame;
            return;
          }

          this.prevSample = avgCurrent * 0.35 + this.prevSample * 0.65;
          const pixelRatio = count ? motionPixels / count : 0;
          const rawScore = pixelRatio * 118;
          this.motionScore = this.motionScore * 0.62 + rawScore * 0.38;
          this.prevFrame = currentFrame;

          if (!this.motionEnabled) {
            if (this.motionActive) {
              this.motionActive = false;
              this.zoneEl.classList.remove("motion");
              for (const peer of this.sessionPeers.values()) {
                sendData(peer.dc, { type: "motion", active: false, score: 0, zone: this.zone });
              }
            }
            return;
          }

          const threshold = 11.5 - sensitivityNorm * 7;
          const releaseThreshold = threshold * 0.52;
          const active = this.motionActive ? this.motionScore > releaseThreshold : this.motionScore > threshold;
          if (active !== this.motionActive) {
            this.motionActive = active;
            this.zoneEl.classList.toggle("motion", active);
            if (active) this.flashMotion();
            const capture = active ? this.captureMotion(this.motionScore) : null;
            for (const peer of this.sessionPeers.values()) {
              sendData(peer.dc, { type: "motion", active, score: Math.round(this.motionScore * 10) / 10, zone: this.zone, capture });
            }
          }
        }

        updateNightVision(luma, noise) {
          const next = nightFromLuma(luma, noise);
          const oldLevel = this.night?.level || 0;
          const smoothLevel = oldLevel * 0.82 + next.level * 0.18;
          this.night = {
            ...next,
            level: smoothLevel,
            brightness: 1 + smoothLevel * 2.25,
            contrast: 1.0,
            saturate: 1 - smoothLevel * 0.28
          };
          this.applyPresentation();
          if (Math.abs(this.night.level - oldLevel) > 0.06) this.broadcastState();
          this.applyNightConstraints();
        }

        applyNightConstraints() {
          if (!this.videoTrack?.getCapabilities || now() - this.lastNightConstraintAt < 2500) return;
          this.lastNightConstraintAt = now();
          const caps = this.videoTrack.getCapabilities();
          const advanced = {};
          const level = this.night?.level || 0;

          if (level > 0.18) {
            if (Array.isArray(caps.exposureMode) && caps.exposureMode.includes("manual")) {
              advanced.exposureMode = "manual";
              if (caps.exposureTime && typeof caps.exposureTime.max === "number") {
                const min = Number(caps.exposureTime.min) || 0;
                const max = Number(caps.exposureTime.max) || 0;
                advanced.exposureTime = clamp(min + (max - min) * 0.85, min, max);
              }
              if (caps.iso && typeof caps.iso.max === "number") {
                const min = Number(caps.iso.min) || 0;
                const max = Number(caps.iso.max) || 0;
                advanced.iso = clamp(min + (max - min) * 0.80, min, max);
              }
            } else if (Array.isArray(caps.exposureMode) && caps.exposureMode.includes("continuous")) {
              advanced.exposureMode = "continuous";
            }
          } else {
            if (Array.isArray(caps.exposureMode) && caps.exposureMode.includes("continuous")) {
              advanced.exposureMode = "continuous";
            }
          }

          if (caps.exposureCompensation && typeof caps.exposureCompensation.max === "number") {
            const min = Number(caps.exposureCompensation.min) || 0;
            const max = Number(caps.exposureCompensation.max) || 0;
            advanced.exposureCompensation = clamp(min + (max - min) * level, min, max);
          }

          if (caps.brightness && typeof caps.brightness.max === "number") {
            const min = Number(caps.brightness.min) || 0;
            const max = Number(caps.brightness.max) || 0;
            advanced.brightness = clamp(min + (max - min) * level, min, max);
          }

          if (!Object.keys(advanced).length) return;
          this.videoTrack.applyConstraints({ advanced: [advanced] })
            .then(() => {
              console.log("Hardware camera night constraints applied successfully:", advanced);
              this.lastExposureAdjustedAt = now();
            })
            .catch((err) => {
              console.warn("Failed to apply hardware camera constraints:", err);
            });
        }

        flashMotion() {
          if (!this.motionFlash) return;
          this.motionFlash.classList.remove("hit");
          void this.motionFlash.offsetWidth;
          this.motionFlash.classList.add("hit");
        }

        captureMotion(score) {
          const stamp = now();
          if (stamp - this.lastCaptureAt < 3500) return null;
          this.lastCaptureAt = stamp;
          const capture = captureVideoFrame(this.video, {
            code: this.code,
            deviceName: this.deviceName,
            ts: stamp,
            score
          });
          if (!capture) return null;
          addGalleryItem(capture, this.galleryScope);
          return capture;
        }

        updatePeerBadge() {
          const peers = Array.from(this.sessionPeers.values());
          const connected = peers.filter((peer) => peer.pc.connectionState === "connected").length;
          this.peerBadge.textContent = `${connected}/${peers.length} viewers`;
        }

        closePeer(session) {
          const peer = this.sessionPeers.get(session);
          if (!peer) return;
          try { peer.dc?.close(); } catch {}
          try { peer.pc?.close(); } catch {}
          this.sessionPeers.delete(session);
          this.updatePeerBadge();
        }

        close() {
          this.closed = true;
          window.clearTimeout(this.motionTimer);
          window.clearInterval(this.heartbeatTimer);
          window.clearInterval(this.presenceTimer);
          if (this.resizeHandler) window.removeEventListener("resize", this.resizeHandler);
          if (this.orientationHandler) {
            window.removeEventListener("orientationchange", this.orientationHandler);
            screen.orientation?.removeEventListener?.("change", this.orientationHandler);
          }
          for (const session of Array.from(this.sessionPeers.keys())) this.closePeer(session);
          this.bus?.close();
          if (this.stream) {
            for (const track of this.stream.getTracks()) track.stop();
          }
        }
      }

      class ReceiverMode {
        constructor() {
          const settings = loadSettings();
          this.deviceName = getDeviceName();
          this.selfId = "receiver-" + this.deviceName + "-" + randomId(5);
          this.peers = new Map();
          this.aliases = loadJson(STORE.aliases, {});
          this.knownPeers = readKnownPeers();
          this.onlineUntil = new Map();
          this.motionEnabled = settings.receiver.motionEnabled !== false;
          this.maximizedCode = "";
          this.closed = false;
          this.resizeHandler = null;
          this.knownTimer = 0;
          this.statsTimer = 0;
        }

        async init() {
          setHtml(`
            <section class="screen receiver">
              <div class="receiver-bar">
                <button id="receiverBack" type="button">Back</button>
                <div id="codeField" class="code-field">
                  <span class="code-help">Enter Sender codes, separated by spaces. Example: 5J6 SJF</span>
                  <input id="codesInput" inputmode="latin" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Sender codes">
                </div>
                <button id="connectBtn" type="button">Connect</button>
                <button id="receiverGallery" type="button">Gallery</button>
                <button id="detectAllBtn" type="button">${this.motionEnabled ? "Detect On" : "Detect Off"}</button>
                <button id="receiverStealthBtn" type="button" style="color: #ff9d9d; border-color: rgba(255, 43, 43, 0.25);">Stealth</button>
                <button id="disconnectAllBtn" type="button">Disconnect</button>
              </div>
              <div id="knownPeers" class="known-peers hidden"></div>
              <div id="receiverGrid" class="grid count-0">
                <div class="empty">Receiver watches Sender codes. Tap feed for full screen. Motion flashes, vibrates, and saves photo.</div>
              </div>
              <div id="motionFlash" class="motion-flash"></div>
              <div id="receiverStatus" class="status hidden"></div>
            </section>
          `);
          this.screen = document.querySelector(".receiver");
          this.grid = document.getElementById("receiverGrid");
          this.input = document.getElementById("codesInput");
          this.codeField = document.getElementById("codeField");
          this.knownEl = document.getElementById("knownPeers");
          this.motionFlash = document.getElementById("motionFlash");
          this.status = createStatusSetter(document.getElementById("receiverStatus"));
          document.getElementById("receiverBack").addEventListener("click", showHome);
          document.getElementById("receiverGallery").addEventListener("click", () => openGallery("Receiver Gallery", "receiver-all"));
          document.getElementById("detectAllBtn").addEventListener("click", () => this.setMotionEnabledAll(!this.motionEnabled));
          document.getElementById("receiverStealthBtn").addEventListener("click", () => enterStealthMode());
          document.getElementById("disconnectAllBtn").addEventListener("click", () => this.disconnectAll());
          document.getElementById("connectBtn").addEventListener("click", () => this.applyCodesFromInput());
          this.input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") this.applyCodesFromInput();
          });
          this.input.addEventListener("input", () => {
            this.input.value = this.input.value.toUpperCase();
            this.updateCodeHelp();
          });
          this.resizeHandler = () => {
            for (const peer of this.peers.values()) {
              applyVideoPresentation(peer.video, peer.remoteState?.rotation || 0, peer.remoteState?.night);
            }
            this.positionAllZones();
          };
          window.addEventListener("resize", this.resizeHandler);

          this.bus = new MqttBus(
            "heat_receiver_" + randomId(8),
            (topic, message) => this.onSignal(topic, message),
            (message, isError) => this.status(message, isError)
          );
          this.renderKnownPeers();
          this.subscribeKnownPeers();
          this.knownTimer = window.setInterval(() => this.renderKnownPeers(), 2000);
          this.statsTimer = window.setInterval(() => this.updateAllPeerStats(), 1000);

          let lastCodes = "";
          try {
            lastCodes = localStorage.getItem(STORE.lastCodes) || "";
          } catch {
            lastCodes = "";
          }
          if (lastCodes.trim()) {
            this.input.value = lastCodes.toUpperCase();
            this.updateCodeHelp();
            await this.connectCodes(normalizeCodes(lastCodes));
          }
          this.updateCodeHelp();
        }

        async applyCodesFromInput() {
          const codes = normalizeCodes(this.input.value);
          await this.connectCodes(codes);
        }

        updateCodeHelp() {
          this.codeField?.classList.toggle("has-value", !!this.input?.value.trim());
        }

        displayNameForCode(code) {
          return this.aliases[code] || this.knownPeers[code]?.deviceName || code;
        }

        subscribeKnownPeers() {
          for (const code of Object.keys(this.knownPeers)) {
            if (CODE_RE.test(code)) this.bus?.subscribe(topicFor(code)).catch(() => {});
          }
        }

        renderKnownPeers() {
          if (!this.knownEl) return;
          const entries = Object.values(this.knownPeers).filter((peer) => CODE_RE.test(peer.code || ""));
          this.knownEl.classList.toggle("hidden", !entries.length);
          if (!entries.length) {
            this.knownEl.innerHTML = "";
            return;
          }
          this.knownEl.innerHTML = entries
            .sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0))
            .map((peer) => {
              const online = (this.onlineUntil.get(peer.code) || 0) > now();
              return `<button class="peer-chip" type="button" data-code="${escapeHtml(peer.code)}">
                <span class="peer-dot ${online ? "online" : ""}"></span>
                <span>${escapeHtml(this.displayNameForCode(peer.code))}</span>
                <span class="mini">${escapeHtml(peer.code)}</span>
              </button>`;
            }).join("");
          this.knownEl.querySelectorAll(".peer-chip").forEach((button) => {
            button.addEventListener("click", () => this.joinKnownPeer(button.dataset.code));
          });
        }

        joinKnownPeer(code) {
          if (!CODE_RE.test(code || "")) return;
          const codes = Array.from(new Set([...normalizeCodes(this.input.value), code]));
          this.input.value = codes.join(" ");
          this.updateCodeHelp();
          this.connectCodes(codes);
        }

        rememberPeer(code, state = {}) {
          if (!CODE_RE.test(code || "")) return;
          this.knownPeers = rememberKnownPeer(code, {
            deviceName: state.deviceName || this.knownPeers[code]?.deviceName || code,
            lastSeen: now()
          });
          this.onlineUntil.set(code, now() + 6500);
          this.renderKnownPeers();
        }

        setMotionEnabledAll(value) {
          this.motionEnabled = !!value;
          document.getElementById("detectAllBtn").textContent = this.motionEnabled ? "Detect On" : "Detect Off";
          updateSettings((settings) => { settings.receiver.motionEnabled = this.motionEnabled; });
          for (const peer of this.peers.values()) {
            this.sendCommand(peer, "setMotionEnabled", { value: this.motionEnabled });
          }
          this.status(this.motionEnabled ? "Detection enabled on all feeds" : "Detection disabled on all feeds");
        }

        disconnectAll() {
          for (const code of Array.from(this.peers.keys())) this.closePeer(code);
          this.input.value = "";
          this.updateCodeHelp();
          try {
            localStorage.setItem(STORE.lastCodes, "");
          } catch {
            // Storage optional.
          }
          this.maximizedCode = "";
          this.updateGrid();
          this.status("All connections closed");
        }

        removeCodeFromInput(code) {
          const next = normalizeCodes(this.input.value).filter((item) => item !== code);
          this.input.value = next.join(" ");
          this.updateCodeHelp();
          try {
            localStorage.setItem(STORE.lastCodes, this.input.value);
          } catch {
            // Storage optional.
          }
        }

        async connectCodes(codes) {
          const validation = validateCodes(codes);
          if (!validation.ok) {
            this.status(validation.message, true);
            return;
          }
          const wanted = validation.codes;
          for (const code of wanted) {
            this.knownPeers = rememberKnownPeer(code, this.knownPeers[code] || {});
          }
          this.renderKnownPeers();
          try {
            localStorage.setItem(STORE.lastCodes, wanted.join(" "));
          } catch {
            // Auto-reconnect is optional when storage is blocked.
          }
          for (const [code, peer] of this.peers) {
            if (!wanted.includes(code)) this.closePeer(code);
          }
          this.updateGrid();
          for (const code of wanted) {
            if (!this.peers.has(code)) {
              this.createPeer(code).catch((error) => this.setPeerStatus(code, "Signal " + cleanError(error), true));
            }
          }
          if (!wanted.length) this.status("No codes");
        }

        async createPeer(code) {
          await this.bus.subscribe(topicFor(code));
          const settings = loadSettings();
          const peer = {
            code,
            session: randomId(10),
            pc: makePeerConnection(),
            dc: null,
            tile: null,
            video: null,
            label: null,
            status: "Connecting",
            remoteState: null,
            zone: { ...DEFAULT_ZONE, ...(settings.receiver.peerZones?.[code] || {}) },
            savedSensitivity: clamp(Number(settings.receiver.peerSensitivity?.[code]) || 55, 20, 100),
            queuedCandidates: [],
            offerTimer: 0,
            retryTimer: 0,
            videoTimer: 0,
            retryCount: 0,
            videoStarted: false,
            closed: false,
            sendZoneThrottled: null
          };
          this.peers.set(code, peer);
          this.updateGrid();

          peer.pc.onicecandidate = (event) => {
            if (event.candidate) {
              this.bus.publish(code, {
                type: "candidate",
                from: this.selfId,
                to: code,
                session: peer.session,
                candidate: event.candidate
              }).catch(() => {});
            }
          };
          peer.pc.ontrack = (event) => {
            const stream = event.streams[0] || new MediaStream([event.track]);
            const startVideo = () => {
              if (!peer.video || peer.closed) return;
              peer.video.muted = true;
              peer.video.autoplay = true;
              peer.video.playsInline = true;
              if (peer.video.srcObject !== stream) peer.video.srcObject = stream;
              applyVideoPresentation(peer.video, peer.remoteState?.rotation || 0, peer.remoteState?.night);
              peer.video.play().catch(() => {});
              peer.videoStarted = true;
              this.watchVideo(peer);
            };
            event.track.onunmute = startVideo;
            event.track.onended = () => this.retryPeer(code, "Video track ended");
            startVideo();
            this.setPeerStatus(code, "Video track");
          };
          peer.pc.onconnectionstatechange = () => {
            if (peer.closed) return;
            const state = peer.pc.connectionState;
            this.setPeerStatus(code, state);
            if (state === "connected") {
              peer.retryCount = 0;
              this.watchVideo(peer);
              sleep(700).then(async () => {
                if (peer.closed) return;
                const codec = await detectVideoCodec(peer.pc, "in");
                if (codec) this.setPeerStatus(code, "Connected " + codec);
              });
            }
            if (state === "failed") this.retryPeer(code, "P2P failed. Trying relay.");
            if (state === "disconnected") {
              window.clearTimeout(peer.retryTimer);
              peer.retryTimer = window.setTimeout(() => this.retryPeer(code, "Disconnected"), 4500);
            }
          };
          peer.pc.oniceconnectionstatechange = () => {
            if (peer.pc.iceConnectionState === "failed") this.retryPeer(code, "ICE failed. Retrying relay.");
          };

          peer.dc = peer.pc.createDataChannel(DATA_CHANNEL, { ordered: true });
          this.bindDataChannel(peer);
          peer.pc.addTransceiver("video", { direction: "recvonly" });
          preferH264(peer.pc);
          const offer = await peer.pc.createOffer();
          await peer.pc.setLocalDescription(offer);
          await this.bus.publish(code, {
            type: "offer",
            from: this.selfId,
            to: code,
            session: peer.session,
            sdp: peer.pc.localDescription
          });
          peer.offerTimer = window.setTimeout(() => {
            if (!peer.closed && !peer.pc.remoteDescription && peer.pc.connectionState !== "connected") {
              this.retryPeer(code, "Offer timeout");
            }
          }, 5000);
          this.setPeerStatus(code, "Offer sent");
        }

        bindDataChannel(peer) {
          peer.dc.onopen = () => {
            this.setPeerStatus(peer.code, "Control open");
            this.sendCommand(peer, "setZone", { zone: peer.zone });
            this.sendCommand(peer, "setSensitivity", { value: peer.savedSensitivity });
            this.sendCommand(peer, "setMotionEnabled", { value: this.motionEnabled });
          };
          peer.dc.onmessage = (event) => this.onData(peer, event.data);
          peer.dc.onclose = () => this.setPeerStatus(peer.code, "Control closed", true);
          peer.dc.onerror = () => this.setPeerStatus(peer.code, "Control error", true);
        }

        onSignal(topic, message) {
          if (this.closed || message.from === this.selfId) return;
          const code = codeFromTopic(topic);
          if (message.type === "presence") {
            this.rememberPeer(code, message.state || message);
            return;
          }
          if (message.to !== this.selfId) return;
          const peer = this.peers.get(code);
          if (!peer || message.session !== peer.session) return;
          if (message.type === "answer" && message.sdp) {
            this.acceptAnswer(peer, message.sdp).catch((error) => this.setPeerStatus(code, "Answer " + cleanError(error), true));
          }
          if (message.type === "candidate" && message.candidate) {
            this.addIce(peer, message.candidate);
          }
        }

        async acceptAnswer(peer, sdp) {
          if (peer.pc.signalingState === "stable") return;
          window.clearTimeout(peer.offerTimer);
          await peer.pc.setRemoteDescription(new RTCSessionDescription(sdp));
          for (const candidate of peer.queuedCandidates.splice(0)) await this.addIce(peer, candidate);
          this.setPeerStatus(peer.code, "Answer set");
        }

        async addIce(peer, candidate) {
          try {
            if (!peer.pc.remoteDescription) {
              peer.queuedCandidates.push(candidate);
              return;
            }
            await peer.pc.addIceCandidate(new RTCIceCandidate(candidate));
          } catch {
            // Stale candidate. Ignore.
          }
        }

        onData(peer, raw) {
          let message;
          try {
            message = JSON.parse(raw);
          } catch {
            return;
          }
          if (!message || typeof message.type !== "string") return;
          if (message.type === "state" || message.type === "heartbeat") {
            const state = message.type === "heartbeat" ? message.state : message;
            if (state) {
              peer.remoteState = state;
              this.rememberPeer(peer.code, state);
              if (state.zone && peer.zoneEl?.dataset.dragging !== "1") peer.zone = normalizeZone(state.zone, getDisplayedVideoRect(peer.video));
              applyVideoPresentation(peer.video, state.rotation || 0, state.night);
              this.updateTile(peer);
            }
          }
          if (message.type === "zone" && message.zone) {
            if (peer.zoneEl?.dataset.dragging !== "1") {
              peer.zone = normalizeZone(message.zone, getDisplayedVideoRect(peer.video));
              this.positionPeerZone(peer);
              this.updateTile(peer);
            }
          }
          if (message.type === "snapshot" && message.capture) {
            this.saveMotionCapture(peer, message.capture);
          }
          if (message.type === "motion") {
            this.showMotion(peer, !!message.active);
            if (message.active) {
              this.alertMotion(peer);
              if (message.capture) {
                this.saveMotionCapture(peer, message.capture);
              } else {
                this.captureReceiverFrame(peer, message.score);
              }
            }
            if (message.zone) {
              if (peer.zoneEl?.dataset.dragging !== "1") {
                peer.zone = normalizeZone(message.zone, getDisplayedVideoRect(peer.video));
                this.positionPeerZone(peer);
                this.updateTile(peer);
              }
            }
          }
        }

        sendCommand(peer, type, payload = {}) {
          if (!sendData(peer.dc, { type, ...payload })) {
            this.setPeerStatus(peer.code, "Control pending", true);
          }
        }

        alertMotion(peer) {
          if (this.motionFlash) {
            this.motionFlash.classList.remove("hit");
            void this.motionFlash.offsetWidth;
            this.motionFlash.classList.add("hit");
          }
          try {
            if (navigator.vibrate) navigator.vibrate(90);
          } catch {
            // Vibration can be blocked by browser policy.
          }
          this.status(`${this.displayNameForCode(peer.code)} detected motion. Photo saved.`);
        }

        saveMotionCapture(peer, capture) {
          const item = {
            ...capture,
            code: capture.code || peer.code,
            deviceName: capture.deviceName || peer.remoteState?.deviceName || peer.code
          };
          addGalleryItem(item, "receiver-all");
          return addGalleryItem(item, `receiver-${peer.code}`);
        }

        captureReceiverFrame(peer, score = 0) {
          const capture = captureVideoFrame(peer.video, {
            code: peer.code,
            deviceName: peer.remoteState?.deviceName || peer.code,
            score
          });
          if (capture) this.saveMotionCapture(peer, capture);
        }

        watchVideo(peer) {
          window.clearTimeout(peer.videoTimer);
          peer.videoTimer = window.setTimeout(() => {
            if (peer.closed) return;
            const video = peer.video;
            const hasFrames =
              !!video &&
              video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
              video.videoWidth > 0 &&
              video.videoHeight > 0;
            if (!hasFrames && peer.pc.connectionState === "connected") {
              this.retryPeer(peer.code, "Video black. Retrying relay.");
            }
          }, 9000);
        }

        retryPeer(code, reason) {
          const peer = this.peers.get(code);
          if (!peer || peer.closed) return;
          this.setPeerStatus(code, reason, true);
          window.clearTimeout(peer.retryTimer);
          peer.retryTimer = window.setTimeout(() => {
            if (this.closed || !this.peers.has(code)) return;
            this.closePeer(code);
            this.createPeer(code).catch((error) => this.setPeerStatus(code, "Retry " + cleanError(error), true));
          }, Math.min(9000, 1800 + peer.retryCount++ * 1200));
        }

        createTile(peer) {
          const tile = document.createElement("article");
          tile.className = "feed";
          tile.dataset.code = peer.code;
          tile.innerHTML = `
            <video autoplay playsinline muted></video>
            <div class="feed-stats-overlay hidden">Stats loading...</div>
            <div class="feed-bar">
              <div class="feed-label"></div>
              <button class="rename" type="button">Rename</button>
            </div>
            <div class="zone"></div>
            <div class="remote-controls">
              <button class="flash" type="button">Flash</button>
              <button class="lens" type="button">Lens</button>
              <button class="shape" type="button">Rect Zone</button>
              <button class="feed-gallery" type="button">Gallery</button>
              <button class="disconnect-one" type="button">Disconnect</button>
              <label class="range-label">Sensitivity
                <input class="remote-sense" type="range" min="20" max="100" value="55" aria-label="Sensitivity">
              </label>
              <button class="close-max" type="button">Min</button>
            </div>
          `;
          peer.tile = tile;
          peer.video = tile.querySelector("video");
          peer.label = tile.querySelector(".feed-label");
          peer.zoneEl = tile.querySelector(".zone");
          peer.flashBtn = tile.querySelector(".flash");
          peer.lensBtn = tile.querySelector(".lens");
          peer.shapeBtn = tile.querySelector(".shape");
          peer.galleryBtn = tile.querySelector(".feed-gallery");
          peer.disconnectBtn = tile.querySelector(".disconnect-one");
          peer.sensitivityEl = tile.querySelector(".remote-sense");
          peer.sendZoneThrottled = throttle(() => this.sendCommand(peer, "setZone", { zone: peer.zone }), 50);

          tile.addEventListener("click", (event) => {
            if (event.target.closest("button,input,.zone")) return;
            this.maximizedCode = this.maximizedCode === peer.code ? "" : peer.code;
            this.updateGrid();
          });
          tile.querySelector(".rename").addEventListener("click", (event) => {
            event.stopPropagation();
            const current = this.aliases[peer.code] || peer.remoteState?.deviceName || peer.code;
            askAlias(current, peer.code, (clean) => {
              if (clean) this.aliases[peer.code] = clean;
              else delete this.aliases[peer.code];
              saveJson(STORE.aliases, this.aliases);
              this.renderKnownPeers();
              this.updateTile(peer);
            });
          });
          peer.flashBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            const next = !peer.remoteState?.torchOn;
            this.sendCommand(peer, "setTorch", { value: next });
          });
          peer.lensBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            this.sendCommand(peer, "switchCamera");
          });
          peer.shapeBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            peer.zone = {
              ...normalizeZone(peer.zone, getDisplayedVideoRect(peer.video)),
              shape: peer.zone.shape === "ellipse" ? "rect" : "ellipse"
            };
            this.positionPeerZone(peer);
            this.sendCommand(peer, "setZone", { zone: peer.zone });
            this.updateTile(peer);
          });
          peer.galleryBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            openGallery(`${this.displayNameForCode(peer.code)} Gallery`, `receiver-${peer.code}`);
          });
          peer.disconnectBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            this.closePeer(peer.code);
            this.removeCodeFromInput(peer.code);
            this.updateGrid();
            this.status(`${peer.code} disconnected`);
          });
          peer.sensitivityEl.addEventListener("input", (event) => {
            event.stopPropagation();
            const value = clamp(Number(peer.sensitivityEl.value) || 55, 20, 100);
            updateSettings((settings) => {
              settings.receiver.peerSensitivity[peer.code] = value;
            });
            this.sendCommand(peer, "setSensitivity", { value });
          });
          tile.querySelector(".close-max").addEventListener("click", (event) => {
            event.stopPropagation();
            this.maximizedCode = "";
            this.updateGrid();
          });
          wireZone(peer.video, peer.zoneEl, () => peer.zone, (zone) => {
            peer.zone = zone;
            updateSettings((settings) => {
              settings.receiver.peerZones[peer.code] = zone;
            });
            peer.sendZoneThrottled();
          });
          peer.video.addEventListener("loadedmetadata", () => this.positionPeerZone(peer));
          return tile;
        }

        updateGrid() {
          const peers = Array.from(this.peers.values());
          this.screen?.classList.toggle("has-max", !!this.maximizedCode);
          this.grid.className = "grid count-" + clamp(peers.length, 0, 4);
          if (!peers.length) {
            this.grid.innerHTML = `<div class="empty">Receiver watches Sender codes. Tap feed for full screen. Motion flashes, vibrates, and saves photo.</div>`;
            return;
          }
          const empty = this.grid.querySelector(".empty");
          safeRemove(empty);
          for (const peer of peers) {
            if (!peer.tile) this.createTile(peer);
            if (!peer.tile.isConnected) this.grid.appendChild(peer.tile);
            peer.tile.classList.toggle("maximized", peer.code === this.maximizedCode);
            this.updateTile(peer);
          }
          this.positionAllZones();
        }

        updateTile(peer) {
          if (!peer.tile) return;
          const alias = this.aliases[peer.code];
          const name = alias || peer.remoteState?.deviceName || peer.code;
          const state = peer.status || peer.pc.connectionState || "new";
          peer.label.textContent = `${name}  ${peer.code}  ${state}`;
          peer.shapeBtn.textContent = peer.zone?.shape === "ellipse" ? "Oval Zone" : "Rect Zone";
          if (peer.remoteState) {
            peer.flashBtn.disabled = !peer.remoteState.torchSupported;
            peer.flashBtn.textContent = peer.remoteState.torchOn ? "Flash On" : "Flash";
            if (document.activeElement !== peer.sensitivityEl) {
              peer.sensitivityEl.value = String(clamp(Number(peer.remoteState.sensitivity) || peer.savedSensitivity || 55, 20, 100));
            }
            applyVideoPresentation(peer.video, peer.remoteState.rotation || 0, peer.remoteState.night);
          }
          this.positionPeerZone(peer);
        }

        setPeerStatus(code, status, isError = false) {
          const peer = this.peers.get(code);
          if (!peer) return;
          peer.status = status;
          peer.tile?.classList.toggle("warn", !!isError);
          this.updateTile(peer);
          if (isError) this.status(`${code} ${status}`, true);
        }

        showMotion(peer, active) {
          peer.tile?.classList.toggle("motion", active);
          peer.zoneEl?.classList.toggle("motion", active);
          if (active) {
            window.clearTimeout(peer.motionTimer);
            peer.motionTimer = window.setTimeout(() => this.showMotion(peer, false), 900);
          }
        }

        positionPeerZone(peer) {
          if (!peer.video || !peer.zoneEl) return;
          if (peer.zoneEl.dataset.dragging === "1") return;
          positionZone(peer.video, peer.zoneEl, peer.zone);
        }

        positionAllZones() {
          for (const peer of this.peers.values()) this.positionPeerZone(peer);
        }

        closePeer(code, keepTile = false) {
          const peer = this.peers.get(code);
          if (!peer) return;
          if (this.maximizedCode === code) this.maximizedCode = "";
          peer.closed = true;
          window.clearTimeout(peer.offerTimer);
          window.clearTimeout(peer.retryTimer);
          window.clearTimeout(peer.videoTimer);
          window.clearTimeout(peer.motionTimer);
          try { peer.dc?.close(); } catch {}
          try { peer.pc?.close(); } catch {}
          if (!keepTile) {
            safeRemove(peer.tile);
            this.peers.delete(code);
          }
        }

        updateAllPeerStats() {
          if (this.closed) return;
          for (const peer of this.peers.values()) {
            if (!peer.pc || peer.closed) continue;
            
            const state = peer.pc.iceConnectionState;
            if (state === "failed" || state === "disconnected") {
              if (!peer.lastDisconnectedAt) {
                peer.lastDisconnectedAt = Date.now();
              } else if (Date.now() - peer.lastDisconnectedAt > 5000) {
                console.warn(`ICE link failed for ${peer.code} for > 5s. Triggering automatic restart...`);
                peer.lastDisconnectedAt = null;
                this.retryPeer(peer.code, "ICE link lost");
                continue;
              }
            } else {
              peer.lastDisconnectedAt = null;
            }

            const statsOverlay = peer.tile?.querySelector(".feed-stats-overlay");
            if (!statsOverlay) continue;

            if (this.maximizedCode !== peer.code) {
              statsOverlay.classList.add("hidden");
              continue;
            }
            statsOverlay.classList.remove("hidden");

            peer.pc.getStats().then((report) => {
              let resWidth = peer.video?.videoWidth || 0;
              let resHeight = peer.video?.videoHeight || 0;
              let fps = 0;
              let iceCandidateType = "unknown";
              let rtt = "n/a";
              let bitrate = 0;

              report.forEach((stat) => {
                if (stat.type === "inbound-rtp" && stat.kind === "video") {
                  if (stat.framesPerSecond) fps = stat.framesPerSecond;
                  if (stat.frameWidth) resWidth = stat.frameWidth;
                  if (stat.frameHeight) resHeight = stat.frameHeight;
                  
                  if (stat.bytesReceived && peer.lastBytesReceived) {
                    const bytes = stat.bytesReceived - peer.lastBytesReceived;
                    const delta = (stat.timestamp - peer.lastTimestamp) / 1000;
                    if (delta > 0) {
                      bitrate = Math.round((bytes * 8) / (delta * 1024));
                    }
                  }
                  peer.lastBytesReceived = stat.bytesReceived;
                  peer.lastTimestamp = stat.timestamp;
                }
                if (stat.type === "candidate-pair" && stat.state === "succeeded") {
                  if (stat.currentRoundTripTime !== undefined) {
                    rtt = Math.round(stat.currentRoundTripTime * 1000) + "ms";
                  }
                  if (report.get(stat.localCandidateId) && report.get(stat.remoteCandidateId)) {
                    const local = report.get(stat.localCandidateId);
                    const remote = report.get(stat.remoteCandidateId);
                    iceCandidateType = `${local.candidateType} -> ${remote.candidateType}`;
                  }
                }
              });

              const lumaInfo = peer.remoteState?.night
                ? `LUMA: ${peer.remoteState.night.luma} | NOISE: ${peer.remoteState.night.noise}`
                : "LUMA: n/a";

              statsOverlay.innerHTML = `
                <div><strong>LINK STATS [${peer.code}]</strong></div>
                <div>RES: ${resWidth}x${resHeight} @ ${Math.round(fps)}fps</div>
                <div>ICE: ${iceCandidateType.toUpperCase()}</div>
                <div>RTT: ${rtt} | RATE: ${bitrate} kbps</div>
                <div>${lumaInfo}</div>
                <div>STATE: ${peer.pc.connectionState.toUpperCase()}</div>
              `;
            }).catch(() => {});
          }
        }

        close() {
          this.closed = true;
          window.clearInterval(this.knownTimer);
          window.clearInterval(this.statsTimer);
          if (this.resizeHandler) window.removeEventListener("resize", this.resizeHandler);
          for (const code of Array.from(this.peers.keys())) this.closePeer(code);
          this.bus?.close();
        }
      }

      window.addEventListener("beforeunload", stopActiveMode);
      showHome();
    })();
  </script>
</body>
</html>
